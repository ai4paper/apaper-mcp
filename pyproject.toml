[project]
name = "apaper-mcp"
version = "0.2.0"
description = "Academic paper research MCP server"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx[socks]>=0.27",
  "mcp>=1.12",
]

[project.scripts]
apaper-mcp = "apaper_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apaper_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
