[project]
name = "apaper-mcp"
version = "0.3.3"
description = "Academic paper research MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "isomoes" }]
requires-python = ">=3.12"
keywords = ["mcp", "academic research", "papers"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx[socks]>=0.27",
  "mcp>=1.12,<2",
  "scrapling[fetchers]>=0.4",
]

[project.scripts]
apaper-mcp = "apaper_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ai4paper/apaper-mcp"
Repository = "https://github.com/ai4paper/apaper-mcp"
Issues = "https://github.com/ai4paper/apaper-mcp/issues"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apaper_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
